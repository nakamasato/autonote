name: release # trusted publisher workflow name

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment:
      name: pypi
      url: https://pypi.org/p/autonote
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true

      - name: Install package
        run: uv sync --locked --no-dev

      - name: Read package version
        id: package-version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/* --target "$GITHUB_SHA" --title "v${RELEASE_VERSION}" --generate-notes
