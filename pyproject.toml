[project]
name = "autonote"
version = "0.6.0"
description = "Automate taking notes"
authors = [{name = "Masato Naka"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "notion-client>=3.0.0,<4.0.0",
    "atlassian-python-api>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "myst-nb>=1.0.0,<2.0.0",
    "sphinx-autoapi>=3.0.0,<4.0.0",
    "sphinx-rtd-theme>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "ruff>=0.16.0,<0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 160
